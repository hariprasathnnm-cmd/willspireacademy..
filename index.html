<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seasonz Studio | AI Based Wedding Studio — Karaikal</title>
  <meta name="description" content="Every love story deserves a cinema release. Seasonz Studio — AI Based Wedding & Event Photography Studio in Karaikal, led by Udhay Shankar." />

  <!-- Google Fonts: Cinema Serif & Clean HUD Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-obsidian: #0A0908;
      --bg-velvet: #14110F;
      --bg-card: #1B1714;
      --text-ivory: #F8F5F0;
      --text-muted: #B8AFA3;
      --gold: #D4AF37;
      --gold-soft: rgba(212, 175, 55, 0.28);
      --gold-glow: rgba(212, 175, 55, 0.14);
      --maroon-accent: #5C1A2B;
      --border-bronze: rgba(212, 175, 55, 0.22);
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: auto;
      background-color: var(--bg-obsidian);
      color: var(--text-ivory);
      font-family: var(--font-sans);
      overflow-x: hidden;
    }

    body {
      background-color: var(--bg-obsidian);
      color: var(--text-ivory);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Cinema Letterbox Bars (Ease Open on Load) */
    .letterbox-bar {
      position: fixed;
      left: 0;
      width: 100%;
      height: 14vh;
      background: #000000;
      z-index: 90;
      pointer-events: none;
      transition: height 1.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .letterbox-top { top: 0; border-bottom: 1px solid rgba(212, 175, 55, 0.15); }
    .letterbox-bottom { bottom: 0; border-top: 1px solid rgba(212, 175, 55, 0.15); }
    body.cinema-ready .letterbox-bar {
      height: 26px;
    }
    @media (max-width: 640px) {
      body.cinema-ready .letterbox-bar {
        height: 16px;
      }
    }

    /* Subtle Animated Film Grain Overlay */
    .film-grain {
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      pointer-events: none;
      z-index: 85;
      opacity: 0.04;
      background-image: radial-gradient(rgba(255, 255, 255, 0.8) 1px, transparent 0);
      background-size: 3px 3px;
      animation: grainShift 0.6s steps(4) infinite;
    }
    @keyframes grainShift {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-2%, 1%); }
      50% { transform: translate(1%, -2%); }
      75% { transform: translate(-1%, -1%); }
      100% { transform: translate(2%, 2%); }
    }

    /* Traveling Golden Cinema Viewfinder HUD */
    .viewfinder-hud {
      position: fixed;
      top: 50%;
      left: 50%;
      width: min(88vw, 980px);
      height: min(68vh, 620px);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 70;
      transition: width 0.5s ease, height 0.5s ease;
    }
    .vf-corner {
      position: absolute;
      width: 26px;
      height: 26px;
      border-color: var(--gold);
      border-style: solid;
      opacity: 0.72;
    }
    .vf-tl { top: 0; left: 0; border-width: 2px 0 0 2px; }
    .vf-tr { top: 0; right: 0; border-width: 2px 2px 0 0; }
    .vf-bl { bottom: 0; left: 0; border-width: 0 0 2px 2px; }
    .vf-br { bottom: 0; right: 0; border-width: 0 2px 2px 0; }

    .vf-reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 50%;
      transform: translate(-50%, -50%) rotate(0deg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .vf-reticle::before,
    .vf-reticle::after {
      content: '';
      position: absolute;
      background: rgba(212, 175, 55, 0.5);
    }
    .vf-reticle::before { width: 10px; height: 1px; }
    .vf-reticle::after { width: 1px; height: 10px; }

    .vf-meta-top {
      position: absolute;
      top: 8px;
      left: 34px;
      right: 34px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(248, 245, 240, 0.75);
    }
    .rec-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #E53935;
      margin-right: 6px;
      box-shadow: 0 0 8px #E53935;
      animation: blinkRec 1.2s infinite;
    }
    @keyframes blinkRec {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .vf-meta-bottom {
      position: absolute;
      bottom: 8px;
      left: 34px;
      right: 34px;
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.8;
    }

    @media (max-width: 640px) {
      .viewfinder-hud {
        width: 92vw;
        height: 74vh;
      }
      .vf-meta-top, .vf-meta-bottom {
        font-size: 8px;
        letter-spacing: 0.12em;
        left: 22px;
        right: 22px;
      }
    }

    /* Top Navigation Bar */
    .studio-nav {
      position: fixed;
      top: 26px;
      left: 0;
      width: 100%;
      z-index: 80;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 5vw;
      background: linear-gradient(to bottom, rgba(10, 9, 8, 0.88), transparent);
    }
    @media (max-width: 640px) {
      .studio-nav { top: 16px; padding: 10px 4vw; }
    }
    .brand-mark {
      display: flex;
      flex-direction: column;
    }
    .brand-name {
      font-family: var(--font-serif);
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--text-ivory);
      text-transform: uppercase;
      line-height: 1;
    }
    .brand-sub {
      font-size: 0.62rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 3px;
    }
    .nav-cta {
      padding: 9px 18px;
      border: 1px solid var(--gold);
      background: rgba(10, 9, 8, 0.72);
      color: var(--gold);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      backdrop-filter: blur(6px);
      transition: all 0.3s ease;
    }
    .nav-cta:hover {
      background: var(--gold);
      color: var(--bg-obsidian);
    }

    /* ACT I: Hero Movie Teaser */
    .act-hero {
      position: relative;
      height: 100vh;
      min-height: 620px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }
    .hero-backdrop {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 25%;
      filter: brightness(0.46) contrast(1.08) saturate(1.12);
      animation: kenBurnsHero 18s ease-in-out infinite alternate;
      transform-origin: center center;
    }
    @keyframes kenBurnsHero {
      0% { transform: scale(1.0); }
      100% { transform: scale(1.12); }
    }
    .hero-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(10, 9, 8, 0.25) 0%, rgba(10, 9, 8, 0.92) 92%);
    }
    #dustCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }
    .hero-content {
      position: relative;
      z-index: 5;
      max-width: 860px;
      padding: 0 24px;
    }
    .trailer-kicker {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 18px;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUpTitle 1s ease forwards 0.4s;
    }
    .hero-title {
      font-family: var(--font-serif);
      font-size: clamp(2.4rem, 6.2vw, 5.1rem);
      font-weight: 600;
      line-height: 1.08;
      letter-spacing: 0.03em;
      color: var(--text-ivory);
      text-shadow: 0 10px 35px rgba(0, 0, 0, 0.85);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUpTitle 1.1s ease forwards 0.75s;
    }
    .hero-title em {
      font-style: italic;
      color: var(--gold);
      font-weight: 400;
    }
    .hero-sub {
      margin: 20px auto 32px;
      max-width: 560px;
      font-size: 0.92rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUpTitle 1.1s ease forwards 1.1s;
    }
    .scroll-cue {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0;
      animation: fadeUpTitle 1s ease forwards 1.5s;
    }
    .scroll-line {
      width: 1px;
      height: 42px;
      background: linear-gradient(to bottom, var(--gold), transparent);
      animation: pulseLine 2s infinite;
    }
    @keyframes fadeUpTitle {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseLine {
      0%, 100% { transform: scaleY(0.6); opacity: 0.4; }
      50% { transform: scaleY(1); opacity: 1; }
    }

    /* Section Containers */
    section {
      position: relative;
      padding: 110px 6vw;
    }
    .section-header {
      text-align: center;
      max-width: 720px;
      margin: 0 auto 64px;
    }
    .act-label {
      font-size: 0.7rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--gold);
      display: block;
      margin-bottom: 10px;
    }
    .section-title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 4.4vw, 3.4rem);
      font-weight: 600;
      line-height: 1.15;
      color: var(--text-ivory);
    }
    .section-title em {
      font-style: italic;
      color: var(--gold);
    }
    .section-desc {
      margin-top: 14px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* ACT II: Widescreen Feature Reels */
    .act-features {
      background: linear-gradient(180deg, var(--bg-obsidian) 0%, var(--bg-velvet) 50%, var(--bg-obsidian) 100%);
    }
    .reel-stack {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 96px;
    }
    .reel-scene {
      display: grid;
      grid-template-columns: 1.25fr 0.85fr;
      gap: 42px;
      align-items: center;
      opacity: 0.25;
      transform: translateY(36px);
      transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .reel-scene.in-focus {
      opacity: 1;
      transform: translateY(0);
    }
    .reel-scene.reverse {
      grid-template-columns: 0.85fr 1.25fr;
    }
    .reel-scene.reverse .reel-frame {
      order: 2;
    }
    .reel-frame {
      position: relative;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      border: 1px solid var(--border-bronze);
      background: var(--bg-card);
      cursor: pointer;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
    }
    .reel-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 22%;
      transition: transform 1.4s cubic-bezier(0.22, 1, 0.36, 1), filter 0.6s ease;
    }
    .reel-frame:hover img {
      transform: scale(1.07);
    }
    .reel-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(10, 9, 8, 0.78);
      border: 1px solid var(--gold-soft);
      color: var(--gold);
      padding: 5px 12px;
      font-size: 0.64rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      backdrop-filter: blur(4px);
    }
    .reel-caption .scene-num {
      font-size: 0.7rem;
      letter-spacing: 0.28em;
      color: var(--gold);
      text-transform: uppercase;
    }
    .reel-caption h3 {
      font-family: var(--font-serif);
      font-size: clamp(1.75rem, 3vw, 2.5rem);
      font-weight: 600;
      margin: 8px 0 12px;
      line-height: 1.15;
    }
    .reel-caption p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 18px;
    }
    .reel-link {
      background: none;
      border: none;
      border-bottom: 1px solid var(--gold);
      color: var(--gold);
      font-family: var(--font-sans);
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding-bottom: 4px;
      cursor: pointer;
    }
    @media (max-width: 860px) {
      .reel-scene, .reel-scene.reverse {
        grid-template-columns: 1fr;
        gap: 22px;
      }
      .reel-scene.reverse .reel-frame {
        order: 0;
      }
    }

    /* ACT III: Interactive AI Color Grade Comparison */
    .act-ai-lab {
      background: var(--bg-velvet);
      border-top: 1px solid var(--border-bronze);
      border-bottom: 1px solid var(--border-bronze);
    }
    .compare-wrapper {
      max-width: 960px;
      margin: 0 auto;
      position: relative;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      border: 1px solid var(--gold-soft);
      user-select: none;
      touch-action: pan-y;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.8);
    }
    @media (max-width: 640px) {
      .compare-wrapper {
        aspect-ratio: 4 / 3;
      }
    }
    .compare-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
    }
    /* Graded Master Layer */
    .compare-graded {
      filter: contrast(1.14) saturate(1.26) sepia(0.12) brightness(1.03);
    }
    /* Raw Unedited Layer Clipped */
    .compare-raw-clip {
      position: absolute;
      inset: 0;
      width: 50%;
      overflow: hidden;
      border-right: 2px solid var(--gold);
    }
    .compare-raw-clip img {
      width: 960px;
      max-width: none;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      filter: saturate(0.45) contrast(0.84) brightness(0.92);
    }
    .compare-handle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--bg-obsidian);
      border: 2px solid var(--gold);
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 0 24px rgba(212, 175, 55, 0.5);
      cursor: ew-resize;
      z-index: 10;
    }
    .compare-tag {
      position: absolute;
      bottom: 16px;
      padding: 6px 12px;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      background: rgba(10, 9, 8, 0.82);
      border: 1px solid var(--border-bronze);
      z-index: 6;
    }
    .tag-raw { left: 16px; color: var(--text-muted); }
    .tag-ai { right: 16px; color: var(--gold); border-color: var(--gold-soft); }

    /* ACT IV: Filterable Chapters of Life Portfolio */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      max-width: 920px;
      margin: 0 auto 44px;
    }
    .filter-btn {
      padding: 9px 18px;
      background: transparent;
      border: 1px solid var(--border-bronze);
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .filter-btn:hover,
    .filter-btn.active {
      border-color: var(--gold);
      background: var(--gold-glow);
      color: var(--gold);
    }

    .portfolio-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 22px;
    }
    .portfolio-card {
      position: relative;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      border: 1px solid var(--border-bronze);
      background: var(--bg-card);
      cursor: pointer;
      transition: transform 0.4s ease, border-color 0.4s ease;
    }
    .portfolio-card.hidden {
      display: none;
    }
    .portfolio-card:hover {
      transform: translateY(-6px);
      border-color: var(--gold);
    }
    .portfolio-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      transition: transform 0.9s ease;
    }
    .portfolio-card:hover img {
      transform: scale(1.08);
    }
    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10, 9, 8, 0.92) 0%, rgba(10, 9, 8, 0.15) 55%, transparent 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
    }
    .card-cat {
      font-size: 0.62rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .card-title {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text-ivory);
      margin-top: 4px;
    }

  <script>
    /* =========================================================================
       1. PORTFOLIO MEDIA CONFIGURATION (TAMIL / SOUTH INDIAN REAL PORTRAITS)
       Replace any URL below with your local file name (e.g., 'wedding-1.jpg')
       when uploading Udhay Shankar's actual Karaikal shoot photos!
    ========================================================================= */
    const STUDIO_MEDIA = {
      hero: "https://images.unsplash.com/photo-1583939003579-730e3918a45a?auto=format&fit=crop&w=1600&q=85",
      aiComparison: "https://images.unsplash.com/photo-1610173827002-62c0f1f05d04?auto=format&fit=crop&w=1400&q=85",
      portfolio: [
        {

        },
        {
          category: "Pre-Wedding",

// Fallback SVG generator so no broken icon ever appears even offline
    function attachFallback(imgEl, label) {
      imgEl.onerror = function () {
        this.onerror = null;
        const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='800'>
          <rect width='100%' height='100%' fill='#14110F'/>
          <rect x='24' y='24' width='1152' height='752' fill='none' stroke='#D4AF37' stroke-opacity='0.4' stroke-width='2'/>
          <text x='50%' y='48%' fill='#D4AF37' font-family='Georgia, serif' font-size='34' text-anchor='middle'>SEASONZ STUDIO</text>
          <text x='50%' y='55%' fill='#B8AFA3' font-family='sans-serif' font-size='18' letter-spacing='4' text-anchor='middle'>${label}</text>
        </svg>`;
        this.src = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
      };
    }

    // 2. Initialize Cinema Opening & Populate Images
    window.addEventListener("DOMContentLoaded", () => {
      requestAnimationFrame(() => document.body.classList.add("cinema-ready"));

      const heroImg = document.getElementById("heroImg");
      heroImg.src = STUDIO_MEDIA.hero;
      attachFallback(heroImg, "TAMIL WEDDING PREMIERE");

      const fWed = document.getElementById("featureWeddingImg");
      const fPre = document.getElementById("featurePreweddingImg");
      const fEng = document.getElementById("featureEngagementImg");
      fWed.src = STUDIO_MEDIA.portfolio[0].src;
      fPre.src = STUDIO_MEDIA.portfolio[1].src;
      fEng.src = STUDIO_MEDIA.portfolio[2].src;
      attachFallback(fWed, "GRAND WEDDING REEL");
      attachFallback(fPre, "PRE-WEDDING REEL");
      attachFallback(fEng, "ENGAGEMENT REEL");

      const aiGraded = document.getElementById("aiGradedImg");
      const aiRaw = document.getElementById("aiRawImg");
      aiGraded.src = STUDIO_MEDIA.aiComparison;
      aiRaw.src = STUDIO_MEDIA.aiComparison;
      attachFallback(aiGraded, "AI CINEMA GRADE");
      attachFallback(aiRaw, "RAW CAPTURE");

      // Render Portfolio Grid
      const grid = document.getElementById("portfolioGrid");
      STUDIO_MEDIA.portfolio.forEach((item, idx) => {
        const card = document.createElement("div");
        card.className = "portfolio-card";
        card.dataset.category = item.category;
        card.dataset.lightboxIndex = idx;
        card.innerHTML = `
          <img src="${item.src}" alt="${item.title}" loading="lazy" />
          <div class="card-overlay">
            <span class="card-cat">${item.category}</span>
            <h3 class="card-title">${item.title}</h3>
          </div>
        `;
        attachFallback(card.querySelector("img"), item.category.toUpperCase());
        grid.appendChild(card);
      });
    });

    // 3. Golden Dust Particles on Hero Canvas
    (function initDust() {
      const canvas = document.getElementById("dustCanvas");
      const ctx = canvas.getContext("2d");
      let w, h;
      const particles = Array.from({ length: 42 }, () => ({
        x: Math.random(),
        y: Math.random(),
        r: Math.random() * 1.8 + 0.5,
        vx: (Math.random() - 0.5) * 0.0004,
        vy: -Math.random() * 0.0005 - 0.0001,
        alpha: Math.random() * 0.6 + 0.2
      }));

      function resize() {
        w = canvas.width = canvas.offsetWidth;
        h = canvas.height = canvas.offsetHeight;
      }
      window.addEventListener("resize", resize);
      resize();

      function tick() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach((p) => {
          p.x = (p.x + p.vx + 1) % 1;
          p.y = (p.y + p.vy + 1) % 1;
          ctx.beginPath();
          ctx.arc(p.x * w, p.y * h, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(212, 175, 55, ${p.alpha})`;
          ctx.fill();
        });
        requestAnimationFrame(tick);
      }
      tick();
    })();

    // 4. Scroll-Linked Golden Camera Viewfinder HUD & Scene Focus
    const hud = document.getElementById("viewfinderHud");
    const reticle = document.getElementById("vfReticle");
    const hudTimecode = document.getElementById("hudTimecode");
    const hudAct = document.getElementById("hudAct");
    const sections = document.querySelectorAll("section[data-act]");
    const reelScenes = document.querySelectorAll("[data-reel]");

    let targetScroll = window.scrollY;
    let currentScroll = window.scrollY;

    window.addEventListener("scroll", () => {
      targetScroll = window.scrollY;
    }, { passive: true });

    function updateCinemaHUD() {
      currentScroll += (targetScroll - currentScroll) * 0.1;
      const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
      const progress = Math.min(1, Math.max(0, currentScroll / maxScroll));

      // Subtle vertical float & reticle rotation driven by scroll
      const offsetY = Math.sin(progress * Math.PI * 4) * 14;
      hud.style.transform = `translate(-50%, calc(-50% + ${offsetY.toFixed(1)}px))`;
      reticle.style.transform = `translate(-50%, -50%) rotate(${(progress * 360).toFixed(1)}deg)`;

      // Live Cinema Timecode (24fps)
      const totalFrames = Math.floor(progress * 25 * 24);
      const frames = String(totalFrames % 24).padStart(2, "0");
      const secs = String(Math.floor(totalFrames / 24) % 60).padStart(2, "0");
      hudTimecode.textContent = `TC 00:00:${secs}:${frames}`;

      // Update Active Act Label
      const midScreen = window.innerHeight * 0.5;
      sections.forEach((sec) => {
        const rect = sec.getBoundingClientRect();
        if (rect.top <= midScreen && rect.bottom >= midScreen) {
          hudAct.textContent = sec.dataset.act;
        }
      });

      // Focus reveal for Feature Reels
      reelScenes.forEach((scene) => {
        const rect = scene.getBoundingClientRect();
        if (rect.top < window.innerHeight * 0.82 && rect.bottom > window.innerHeight * 0.15) {
          scene.classList.add("in-focus");
        }
      });

      requestAnimationFrame(updateCinemaHUD);
    }
    requestAnimationFrame(updateCinemaHUD);

    // 5. Interactive AI Color Grade Comparison Slider
    const compareBox = document.getElementById("compareBox");
    const compareClip = document.getElementById("compareClip");
    const compareHandle = document.getElementById("compareHandle");
    const aiRawImg = document.getElementById("aiRawImg");
    let isDragging = false;

    function syncRawImageWidth() {
      if (compareBox && aiRawImg) {
        aiRawImg.style.width = compareBox.offsetWidth + "px";
      }
    }
    window.addEventListener("resize", syncRawImageWidth);
    syncRawImageWidth();

    function setSliderPosition(clientX) {
      const rect = compareBox.getBoundingClientRect();
      let pct = ((clientX - rect.left) / rect.width) * 100;
      pct = Math.max(5, Math.min(95, pct));
      compareClip.style.width = pct + "%";
      compareHandle.style.left = pct + "%";
    }

    compareBox.addEventListener("mousedown", (e) => { isDragging = true; setSliderPosition(e.clientX); });
    window.addEventListener("mouseup", () => { isDragging = false; });
    window.addEventListener("mousemove", (e) => { if (isDragging) setSliderPosition(e.clientX); });

    compareBox.addEventListener("touchstart", (e) => { isDragging = true; setSliderPosition(e.touches[0].clientX); }, { passive: true });
    window.addEventListener("touchend", () => { isDragging = false; });
    window.addEventListener("touchmove", (e) => { if (isDragging) setSliderPosition(e.touches[0].clientX); }, { passive: true });

    // 6. Portfolio Category Filter
    document.getElementById("filterBar").addEventListener("click", (e) => {
      const btn = e.target.closest(".filter-btn");
      if (!btn) return;
      document.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");

      const filter = btn.dataset.filter;
      document.querySelectorAll(".portfolio-card").forEach((card) => {
        if (filter === "all" || card.dataset.category === filter) {
          card.classList.remove("hidden");
        } else {
          card.classList.add("hidden");
        }
      });
    });

    // 7. Fullscreen Cinema Lightbox
    const lightboxModal = document.getElementById("lightboxModal");
    const lbImg = document.getElementById("lbImg");
    const lbTitle = document.getElementById("lbTitle");
    const lbMeta = document.getElementById("lbMeta");

    document.addEventListener("click", (e) => {
      const trigger = e.target.closest("[data-lightbox-index]");
      if (!trigger) return;
      const item = STUDIO_MEDIA.portfolio[Number(trigger.dataset.lightboxIndex)];
      if (!item) return;
      lbImg.src = item.src;
      lbTitle.textContent = item.title;
      lbMeta.textContent = `${item.category} • ${item.location}`;
      lightboxModal.classList.add("open");
    });

    document.getElementById("lbClose").addEventListener("click", () => lightboxModal.classList.remove("open"));
    lightboxModal.addEventListener("click", (e) => {
      if (e.target === lightboxModal) lightboxModal.classList.remove("open");
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") lightboxModal.classList.remove("open");
    });

    // 8. WhatsApp Booking Redirect (+91 90438 19496)
    document.getElementById("whatsappForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("clientName").value.trim();
      const type = document.getElementById("shootType").value;
      const date = document.getElementById("eventDate").value;
      const city = document.getElementById("eventCity").value.trim() || "Karaikal";

      const msg =
        `Vanakkam Seasonz Studio! 🎬✨\n\n` +
        `I watched your cinema portfolio and would like to check shoot availability:\n` +
        `• Name: ${name}\n` +
        `• Shoot Type: ${type}\n` +
        `• Event Date: ${date}\n` +
        `• Location: ${city}\n\n` +
        `Please share package details.`;

      window.open(`https://wa.me/919043819496?text=${encodeURIComponent(msg)}`, "_blank");
    });

    // 9. 25-Second Auto-Play Trailer Button (For Screen Recording Instagram Reels)
    const autoPlayBtn = document.getElementById("autoPlayBtn");
    let autoScrollRaf = null;

    autoPlayBtn.addEventListener("click", () => {
      if (autoScrollRaf) cancelAnimationFrame(autoScrollRaf);
      autoPlayBtn.classList.add("recording-hidden");
      window.scrollTo(0, 0);

      const duration = 25000; // 25 seconds
      const startTime = performance.now();
      const endY = document.documentElement.scrollHeight - window.innerHeight;

      function step(now) {
        const elapsed = now - startTime;
        const t = Math.min(1, elapsed / duration);
        // Smooth cinema ease-in-out
        const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        window.scrollTo(0, endY * ease);

        if (t < 1) {
          autoScrollRaf = requestAnimationFrame(step);
        } else {
          autoScrollRaf = null;
          autoPlayBtn.classList.remove("recording-hidden");
        }
      }
      autoScrollRaf = requestAnimationFrame(step);
    });

    // Stop auto-scroll if user touches/wheels manually
    ["wheel", "touchstart"].forEach((evt) => {
      window.addEventListener(evt, () => {
        if (autoScrollRaf) {
          cancelAnimationFrame(autoScrollRaf);
          autoScrollRaf = null;
          autoPlayBtn.classList.remove("recording-hidden");
        }
      }, { passive: true });
    });
  </script>
